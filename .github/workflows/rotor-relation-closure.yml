name: Rotor relation closure
on:
 push:
  branches: [main]
  paths: ["benchmarks/rotor_relation_closure.py",".github/workflows/rotor-relation-closure.yml"]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 closure:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12", cache: pip}
   - run: python -m pip install -e ".[dev]"
   - run: python benchmarks/rotor_relation_closure.py
   - if: always()
     uses: actions/upload-artifact@v4
     with: {name: "rotor-relation-${{ github.run_id }}", path: "results/", if-no-files-found: error}
