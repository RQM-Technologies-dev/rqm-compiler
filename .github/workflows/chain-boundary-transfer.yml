name: Chain boundary transfer
on:
 push:
  branches: [main]
  paths: ["benchmarks/chain_boundary_transfer.py",".github/workflows/chain-boundary-transfer.yml","src/rqm_compiler/stable_prototype.py"]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 chain:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@v7
   - uses: actions/setup-python@v7
     with: {python-version: "3.12", cache: pip}
   - run: |
       python -m pip install -e ".[dev]"
       python -m pip install "qiskit>=2,<3" "qiskit-aer>=0.17,<0.18"
   - run: python benchmarks/chain_boundary_transfer.py
   - if: always()
     uses: actions/upload-artifact@v7
     with:
       name: chain-boundary-transfer-${{ github.run_id }}
       path: results/
       if-no-files-found: error
