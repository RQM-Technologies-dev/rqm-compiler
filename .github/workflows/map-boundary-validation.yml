name: Map boundary validation
on:
 push:
  branches: [main]
  paths: ["benchmarks/map_boundary_validation.py",".github/workflows/map-boundary-validation.yml"]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 validate:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12", cache: pip}
   - run: python -m pip install -e ".[dev]"
   - run: python benchmarks/map_boundary_validation.py
   - if: always()
     uses: actions/upload-artifact@v4
     with: {name: "map-boundary-${{ github.run_id }}", path: "results/", if-no-files-found: error}
