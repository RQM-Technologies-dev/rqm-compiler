name: Topology direct readout
on:
 push:
  branches: [main]
  paths: ["benchmarks/topology_readout.py",".github/workflows/topology-readout.yml"]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 topology:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12", cache: pip}
   - run: python -m pip install -e ".[dev]"
   - run: python benchmarks/topology_readout.py
   - if: always()
     uses: actions/upload-artifact@v4
     with: {name: "topology-readout-${{ github.run_id }}", path: "results/", if-no-files-found: error}
