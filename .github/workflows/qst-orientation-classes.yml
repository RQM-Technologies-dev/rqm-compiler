name: QST orientation classes
on:
 push:
  branches: [main]
  paths: ["benchmarks/qst_orientation_classes.py",".github/workflows/qst-orientation-classes.yml"]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 classify:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12", cache: pip}
   - run: python -m pip install -e ".[dev]"
   - run: python benchmarks/qst_orientation_classes.py
   - if: always()
     uses: actions/upload-artifact@v4
     with: {name: "qst-orientation-${{ github.run_id }}", path: "results/", if-no-files-found: error}
