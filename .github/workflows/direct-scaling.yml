name: Direct readout scaling
on:
 push:
  branches: [main]
  paths: ["benchmarks/direct_scaling.py",".github/workflows/direct-scaling.yml"]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 scale:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12", cache: pip}
   - run: python -m pip install -e ".[dev]"
   - run: python benchmarks/direct_scaling.py
   - if: always()
     uses: actions/upload-artifact@v4
     with: {name: "direct-scaling-${{ github.run_id }}", path: "results/", if-no-files-found: error}
