name: TN convention diagnostic
on:
 push:
  branches: [main]
  paths: ["benchmarks/tn_convention_diagnostic.py",".github/workflows/tn-convention-diagnostic.yml"]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 diagnose:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@v7
   - uses: actions/setup-python@v7
     with: {python-version: "3.12", cache: pip}
   - run: python -m pip install -e ".[dev]"
   - run: python benchmarks/tn_convention_diagnostic.py
   - if: always()
     uses: actions/upload-artifact@v7
     with: {name: "tn-convention-${{ github.run_id }}", path: "results/", if-no-files-found: error}
