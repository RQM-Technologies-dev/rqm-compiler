name: Representation scaling benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["benchmarks/**","src/rqm_compiler/**","tests/test_adaptive_failure_classification.py","tests/test_z_adaptive_cartan.py",".github/workflows/representation-benchmark.yml"]
permissions: {contents: read}
concurrency:
  group: representation-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: End-to-end simulation speedup gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install compiler and SU4 decomposition extra
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "rqm-entanglement[qiskit]>=0.2,<0.3"
      - name: Adaptive promotion gate
        run: python -m pytest -q tests/test_z_adaptive_cartan.py::test_selective_policy_emits_proof_carried_internal_window
      - name: Run simulation speedup gate
        run: |
          mkdir -p results
          python benchmarks/simulation_speedup_gate.py --csv results/simulation_speedup.csv --json results/simulation_speedup.json > results/simulation_speedup_stdout.json
      - name: Analyze speedup claims
        run: |
          python - <<'PY'
          import csv,json,statistics
          rows=list(csv.DictReader(open('results/simulation_speedup.csv')))
          assert len(rows)==3*7*3*2
          valid=[r for r in rows if r['speedup_claim_valid'].lower()=='true']
          bad=[r for r in rows if r['rqm_query_available'].lower()=='true' and float(r['abs_error'])>1e-9]
          assert not bad, bad[:3]
          summary={
            'conditions':len(rows),
            'valid_equal-output_conditions':len(valid),
            'unavailable_conditions':sum(r['rqm_query_available'].lower()!='true' for r in rows),
            'speedup_gt_1_conditions':sum(r['speedup_claim_valid'].lower()=='true' and float(r['speedup'])>1 for r in rows),
            'max_speedup':max((float(r['speedup']) for r in valid),default=None),
            'median_speedup':statistics.median([float(r['speedup']) for r in valid]) if valid else None,
            'largest_n_with_valid_claim':max((int(r['n']) for r in valid),default=None),
          }
          json.dump(summary,open('results/simulation_speedup_summary.json','w'),indent=2)
          print(summary)
          for n in (4,8,12,16):
            xs=[r for r in valid if int(r['n'])==n]
            if xs: print('n',n,'median',statistics.median(float(r['speedup']) for r in xs),'max',max(float(r['speedup']) for r in xs))
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-speedup-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 90
