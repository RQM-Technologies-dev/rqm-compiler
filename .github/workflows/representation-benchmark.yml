name: Representation scaling benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["benchmarks/**","src/rqm_compiler/**","tests/test_adaptive_failure_classification.py","tests/test_z_adaptive_cartan.py",".github/workflows/representation-benchmark.yml"]
permissions: {contents: read}
concurrency:
  group: representation-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: Global information extraction frontier
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install compiler and SU4 decomposition extra
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "rqm-entanglement[qiskit]>=0.2,<0.3"
      - name: Adaptive promotion gate
        run: python -m pytest -q tests/test_z_adaptive_cartan.py::test_selective_policy_emits_proof_carried_internal_window
      - name: Run global extraction experiment
        run: |
          mkdir -p results
          python benchmarks/global_extraction.py --csv results/global_extraction.csv --json results/global_extraction.json > results/global_extraction_stdout.json
      - name: Analyze extraction frontier
        run: |
          python - <<'PY'
          import csv,json,statistics
          from collections import defaultdict
          rows=list(csv.DictReader(open('results/global_extraction.csv')))
          assert len(rows)==3*8*3*2*6
          # Scientific-integrity gate: no direct compact extractor is claimed yet.
          assert all(r['compact_direct_extractor_available'].lower()=='false' for r in rows)
          assert all((int(r['n'])<=8)==(r['reference_available'].lower()=='true') for r in rows)
          g=defaultdict(list)
          for r in rows:g[(r['family'],int(r['n']),int(r['rounds']))].append(int(r['cr']))
          summary=[{'family':k[0],'n':k[1],'rounds':k[2],'median_cr':statistics.median(v)} for k,v in sorted(g.items())]
          json.dump(summary,open('results/global_extraction_summary.json','w'),indent=2)
          frontier={
            'largest_exact_dense_reference_n':8,
            'largest_compact_compilation_n':max(int(r['n']) for r in rows),
            'direct_compact_extractor_available':False,
            'interpretation':'This run establishes the extraction frontier; it does not claim efficient global-state extraction from the compact representation.'
          }
          json.dump(frontier,open('results/extraction_frontier.json','w'),indent=2)
          print(frontier)
          print([x for x in summary if x['n']==64 and x['rounds']==16])
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-extraction-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 90
