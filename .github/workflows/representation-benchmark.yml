name: Representation scaling benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "src/rqm_compiler/**"
      - "tests/test_adaptive_failure_classification.py"
      - "tests/test_z_adaptive_cartan.py"
      - ".github/workflows/representation-benchmark.yml"
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
concurrency:
  group: representation-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: Overlap topology and adaptive closure
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q tests/test_adaptive_failure_classification.py tests/test_z_adaptive_cartan.py
      - name: Focused failure diagnostic
        run: |
          mkdir -p results
          python benchmarks/adaptive_failure_diagnostic.py --json results/focused_failure_diagnostic.json > results/focused_failure_diagnostic_stdout.json
      - name: Run overlap topology experiment
        run: |
          python benchmarks/overlap_closure.py --csv results/overlap_closure.csv --json results/overlap_closure.json > results/overlap_closure_stdout.json
      - name: Analyze overlap topology
        run: |
          python - <<'PY'
          import csv,json,statistics
          from collections import defaultdict,Counter
          rows=list(csv.DictReader(open('results/overlap_closure.csv')))
          assert len(rows)==4*5*3*5
          assert {r['topology'] for r in rows}=={'disjoint','chain','star','random','dense'}
          assert {int(r['n']) for r in rows}=={4,8,16,32}
          assert {int(r['rounds']) for r in rows}=={1,2,4,8,16}
          grouped=defaultdict(list); roots=Counter()
          for r in rows:
            grouped[(r['topology'],int(r['n']),int(r['rounds']))].append(int(r['cr']))
            roots.update(json.loads(r['root_causes']))
            if int(r['n'])<=16:
              assert float(r['parity_z_error']) < 1e-9
              assert float(r['amplitude_0_error']) < 1e-9
          summary=[]
          for (top,n,d),vals in sorted(grouped.items()): summary.append({'topology':top,'n':n,'rounds':d,'median_cr':statistics.median(vals)})
          json.dump(summary,open('results/overlap_summary.json','w'),indent=2)
          json.dump(dict(roots),open('results/overlap_root_causes.json','w'),indent=2)
          print('conditions',len(rows),'root_causes',dict(roots))
          print('n32-r16',[(x['topology'],x['median_cr']) for x in summary if x['n']==32 and x['rounds']==16])
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlap-closure-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 90
