name: Direct readout invariant
on:
 push:
  branches: [main]
  paths: ["src/rqm_compiler/direct_readout.py","benchmarks/direct_readout.py",".github/workflows/direct-readout.yml"]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 test:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12", cache: pip}
   - run: python -m pip install -e ".[dev]"
   - run: python benchmarks/direct_readout.py
   - if: always()
     uses: actions/upload-artifact@v4
     with: {name: "direct-readout-${{ github.run_id }}", path: "results/", if-no-files-found: error}
