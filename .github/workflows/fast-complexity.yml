name: Fast complexity benchmark
on:
  push:
    branches: [main]
    paths: ["benchmarks/fast_complexity.py",".github/workflows/fast-complexity.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -e ".[dev]"
          python -m pip install "rqm-entanglement[qiskit]>=0.2,<0.3"
      - run: python benchmarks/fast_complexity.py
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-complexity-${{ github.run_id }}
          path: results/
          if-no-files-found: error
