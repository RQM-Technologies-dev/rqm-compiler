name: Compiler job taxonomy
on:
 push:
  branches: [main]
  paths: ["benchmarks/job_taxonomy.py",".github/workflows/job-taxonomy.yml","src/rqm_compiler/stable_prototype.py"]
 workflow_dispatch:
 pull_request:
  branches: [main]
  paths:
   - "benchmarks/job_taxonomy.py"
   - ".github/workflows/job-taxonomy.yml"
permissions: {contents: read}
jobs:
 taxonomy:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  env:
   OPENBLAS_NUM_THREADS: "1"
   OMP_NUM_THREADS: "1"
   REPEATS: "5"
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12", cache: pip}
   - name: Build and install the recorded wheel
     run: |
       python -m pip install build
       python -m build --wheel
       python -m pip install dist/*.whl "qiskit>=2.5,<2.6" "qiskit-aer>=0.17,<0.18"
       python -m pip check
       python - <<'PYCODE'
       import os
       from pathlib import Path
       import rqm_compiler
       assert "site-packages" in Path(rqm_compiler.__file__).parts
       wheels = list(Path("dist").glob("rqm_compiler-*.whl"))
       assert len(wheels) == 1
       with open(os.environ["GITHUB_ENV"], "a") as output:
           print(f"RQM_CANDIDATE_WHEEL={wheels[0].resolve()}", file=output)
           print(f"RQM_CANDIDATE_COMMIT={os.environ['GITHUB_SHA']}", file=output)
       PYCODE
   - name: Run frozen taxonomy from a clean output directory
     run: |
       mkdir -p "$RUNNER_TEMP/rqm-taxonomy"
       cd "$RUNNER_TEMP/rqm-taxonomy"
       python "$GITHUB_WORKSPACE/benchmarks/job_taxonomy.py"
   - if: always()
     uses: actions/upload-artifact@v4
     with:
       name: compiler-job-taxonomy-${{ github.run_id }}
       path: ${{ runner.temp }}/rqm-taxonomy/results/
       if-no-files-found: error
