name: Recursive rotor closure
on:
 push:
  branches: [main]
  paths: ["benchmarks/recursive_rotor_closure.py",".github/workflows/recursive-rotor-closure.yml"]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 closure:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@v7
   - uses: actions/setup-python@v7
     with: {python-version: "3.12", cache: pip}
   - run: python -m pip install -e ".[dev]"
   - run: python benchmarks/recursive_rotor_closure.py
   - if: always()
     uses: actions/upload-artifact@v7
     with: {name: "recursive-rotor-${{ github.run_id }}", path: "results/", if-no-files-found: error}
