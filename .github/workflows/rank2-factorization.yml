name: Rank2 spectral factorization
on:
 push:
  branches: [main]
  paths: ["benchmarks/rank2_factorization.py",".github/workflows/rank2-factorization.yml"]
 workflow_dispatch:
permissions: {contents: read}
jobs:
 factor:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@v7
   - uses: actions/setup-python@v7
     with: {python-version: "3.12", cache: pip}
   - run: python -m pip install -e ".[dev]"
   - run: python benchmarks/rank2_factorization.py
   - if: always()
     uses: actions/upload-artifact@v7
     with: {name: "rank2-factorization-${{ github.run_id }}", path: "results/", if-no-files-found: error}
