[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rqm-compiler"
version = "0.2.2"
description = "Quaternionic quantum compiler for the RQM ecosystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rqm-core>=0.2,<0.3",
  "rqm-entanglement>=0.2,<0.3",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "RQM Technologies" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics"
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/RQM-Technologies-dev/rqm-compiler"
Repository = "https://github.com/RQM-Technologies-dev/rqm-compiler"
Issues = "https://github.com/RQM-Technologies-dev/rqm-compiler/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
